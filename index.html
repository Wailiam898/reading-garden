shell(html,meet.phase===0?`Here is a new sound friend. Our picture is ${t.hook}. Listen, then trace with your finger from the gold dot. You can also tap the tracing hand. Grown-up, please model the pure sound if it is not recorded.`:meet.phase===1?'Let us match it together. Tap the letter shape that looks the same.':'Your turn. Tap the tile to make this sound friend.', 'meet');if(meet.phase===0)wireTrace();else if(meet.phase===1)$('[data-correct=true]')?.classList.add('help');}
function updateMeetNext(){let el=$('#meet-next');if(el)el.setAttribute('aria-disabled',String(!(meet.heard&&meet.traced)));}
actions['meet-hear']=()=>{meet.heard=true;A.phoneme(meet.target.id);updateMeetNext();};actions['trace-tap']=()=>{meet.traced=true;$('#trace-ink').innerHTML=[...$('#trace').querySelectorAll('.guide')].map(p=>p.outerHTML.replace('class="guide"','class="drawn"')).join('');$('#trace-status').textContent='We traced together. Now try with your finger, if you like.';say('We traced together. You can try with your finger too.');updateMeetNext();};actions['meet-next']=()=>{if(!meet.heard||!meet.traced){say('First tap the speaker to listen, then trace or tap the tracing hand.');return;}meet.phase=1;drawMeet();};actions['meet-answer']=el=>{if(el.dataset.value!==meet.target.id){el.classList.remove('chosen');$('[data-correct=true]')?.classList.add('help');say('Let us look and listen again. Tap the glowing shape.');return;}if(meet.phase===1){meet.phase=2;drawMeet();return;}if(!state.taught.includes(meet.target.id))state.taught.push(meet.target.id);state.intro[meet.target.id]=true;C.record(state,'sound:'+meet.target.id,true,true);save();round={kind:'meet',n:1,total:1};celebrate('A new sound friend!',false);};
function begin(kind){if(ended){endScreen();return;}if(kind==='hunt'||kind==='flash'){let ids=state.taught.filter(id=>kind!=='flash'||C.mastered(state,'sound:'+id));if(!ids.length){showMeet();return;}round={kind,n:0,total:6,last:'',guided:{}};}else if(kind==='listen'){round={kind,n:0,total:6};}else if(kind==='read'){let pool=D.sentences.filter(p=>p.set<=state.stage&&C.canRead(p.text,state));if(!pool.length){showHearts();say('We need a few more sound friends and heart words before our sentences. Let us learn together.');return;}round={kind,n:0,total:4,pool};}else{let pool=needWords(kind);if(!pool)return;round={kind,n:0,total:4,pool};}drawRound();}
function chooseWeighted(items,key,last){let candidates=items.filter(x=>key(x)!==last);if(!candidates.length)candidates=items;let weights=candidates.map(x=>C.reviewWeight(state,key(x)));let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total;return candidates[weights.findIndex(w=>(r-=w)<0)]||candidates[0];}
function drawRound(){if(round.n>=round.total){celebrate('A little round, a lovely effort.',true);return;}round.helped=false;round.done=false;round.listened=false;round.heard=[];round.blended=false;round.built=[];round.staged=0;round.choices=null;round.tappedWords=[];round.modelled=false;const kind=round.kind;if(kind==='hunt'||kind==='flash'){
let ids=state.taught.filter(id=>kind!=='flash'||C.mastered(state,'sound:'+id));let target=chooseWeighted(ids,x=>'sound:'+x,round.last);round.target=target;round.last='sound:'+target;let t=C.soundFor(target),num=C.mastered(state,'sound:'+target)&&ids.length>=4?4:2;let pool=C.huntPool(state,target).filter(id=>ids.includes(id));num=Math.min(num,pool.length);if(pool.length===1){pool.push('shape');num=2;}round.guided[target]=(round.guided[target]||0)+1;let guide=!state.stats['sound:'+target]?.attempts&&round.guided[target]===1;round.helped=guide;shell(`<div class="phase">${kind==='flash'?'Familiar friends · no clock':'Sound hunt'}</div><h2>Find our sound friend.</h2>${dots()}${speech()}${btn('target-sound','🔊 Listen again','pink','style="width:100%"')}${choicesFor(target,pool,num,x=>x==='shape'?'○':esc(C.soundFor(x).g))}<p class="hint">Grown-up: listen to the pure sound together. Whole-word clues are temporary until you record the sounds.</p>`,guide?'I will help first. Listen, then tap the glowing sound friend.':'Listen carefully. Which shape makes our sound? Tap the speaker, then choose.',kind);if(guide)$('[data-correct=true]')?.classList.add('help');
}else if(kind==='blend'||kind==='build'){
let target=chooseWeighted(round.pool,x=>'word:'+x.text,round.last);round.word=target;round.last='word:'+target.text;round.mode=!state.stats['word:'+target.text]?.attempts?'model':'independent';drawWord();
}else if(kind==='read'){
round.sentence=round.pool[round.n%round.pool.length];drawSentence();
}else{drawListening();}}
function dots(){return `<div class="progress" aria-label="Little steps">${Array.from({length:round.total},(_,i)=>`<i class="${i<round.n?'done':''}"></i>`).join('')}</div>`;}
function nextQuestion(){round.n++;drawRound();}
function correct(key){if(round.done)return;round.done=true;if(key)C.record(state,key,true,round.helped||round.modelled);save();$('#feedback')?.remove();let div=document.createElement('div');div.id='feedback';div.className='stack';div.innerHTML=`<div class="speech">You listened to every sound.</div>${btn('next','🌼 Next little step','primary')}`;$('#screen').append(div);say(round.helped?'You listened again and tried another way. Let us take our next little step.':'You listened to every sound. Let us take our next little step.');}
function wrong(key){if(!round.helped&&key)C.record(state,key,false,false);round.helped=true;save();$('[data-correct=true]')?.classList.add('help');let r=round,where=screen;say('Let us listen again. The glowing picture or shape will help. Have another go.').then(()=>{if(round!==r||screen!==where||r.done)return;if(r.kind==='hunt'||r.kind==='flash')A.phoneme(r.target);else if(r.word)A.say(r.word.text);else if(r.listen)A.say(r.listen.prompt);});}
actions.answer=el=>{if(round.done)return;let kind=round.kind;if(kind==='hunt'||kind==='flash'){if(!round.listened){say('Tap the pink speaker first. Listen, then choose your sound friend.');return;}if(el.dataset.value!==round.target){wrong('sound:'+round.target);return;}correct('sound:'+round.target);}else if(kind==='blend'){if(el.dataset.value!==round.word.text){wrong('word:'+round.word.text);A.say(round.word.text);return;}if(round.mode==='guided'){C.record(state,'word:'+round.word.text,true,true);save();round.mode='independent';round.helped=false;round.modelled=false;round.heard=[];round.blended=false;drawWord();return;}let first=!state.firstWord;state.firstWord=true;correct('word:'+round.word.text);if(first){$('#feedback').innerHTML+=btn('first-word','🙌 Show my grown-up!','gold');}}};actions.next=nextQuestion;actions['target-sound']=()=>{round.listened=true;A.phoneme(round.target);};
function drawWord(){let w=round.word,build=round.kind==='build';let stage=round.mode==='model'?'I do':round.mode==='guided'?'We do':'You do';shell(`<div class="phase">${build?'Build it':'Blend it'} · ${stage}</div><h2>${build?'A home for every sound.':'Little sounds, one word.'}</h2>${dots()}${speech()}${round.mode==='model'?`<div class="panel center"><div class="picture">${w.pic}</div><div id="model-word" class="word-line" style="font-size:44px">${w.parts.map(p=>esc(C.soundFor(p).g)).join(' ')}</div><p>I do → we do → you do</p>${btn('word-model','🔊 Watch & listen','primary','style="width:100%"')}<p class="hint">A grown-up can say each pure sound, sweep under the word, then say the whole word. Do not add an “uh”.</p>${btn('word-we','🤝 Let us do it together','pink','style="width:100%;margin-top:10px"')}</div>`:build?`<div class="center picture">${w.pic}</div>${btn('whole-word','🔊 Hear the word','pink','style="width:100%"')}<div class="boxes" id="boxes">${w.parts.map(()=>'<div class="box">·</div>').join('')}</div><div class="tiles" id="tiles"></div><div class="row" style="margin-top:20px">${btn('build-undo','↩ One step back')}${btn('build-help','🤝 Together')}</div>`:`<div class="sound-buttons">${w.parts.map((p,i)=>btn('part',`${esc(C.soundFor(p).g)}<i aria-hidden="true"></i>`,'',`data-index="${i}" aria-label="Sound button ${i+1}"`)).join('')}</div>${btn('blend-arrow','➜ Slide or tap to blend','blend','aria-disabled="true"')}<div id="picture-options"></div><p class="hint">Grown-up: wait for every sound, then sweep left to right. Pictures appear after blending, not as guessing clues.</p>`}`,round.mode==='model'?`Watch me. We are making the word ${w.text}. Tap watch and listen. Grown-up, model the sounds from left to right, then blend.`:build?`The word is ${w.text}. ${round.mode==='guided'?'We will do it together.':'Your turn.'} Tap one tile for each sound, from left to right.`:`${round.mode==='guided'?'We will do it together.':'Your turn.'} Tap each sound button. Then slide or tap the arrow to blend.`,round.kind);
if(round.mode==='model'){round.modelled=true;return;}if(build)drawTiles();else{let arrow=$('[data-act=blend-arrow]'),x;arrow.onpointerdown=e=>x=e.clientX;arrow.onpointerup=e=>{if(e.clientX-x>40)blendArrow();};}if(round.mode==='guided'&&build)highlightTile();}
function drawTiles(){let w=round.word,letters=[...new Set([...w.parts,...state.taught.filter(p=>!w.parts.includes(p)&&!w.parts.some(q=>C.soundFor(q).ipa===C.soundFor(p).ipa||C.soundFor(q).g===C.soundFor(p).g)).slice(0,2)])].sort(()=>Math.random()-.5);$('#tiles').innerHTML=letters.map(p=>btn('tile',esc(C.soundFor(p).g),'',`data-value="${p}" data-correct="${p===w.parts[round.built.length]}"`)).join('');$('#boxes').innerHTML=w.parts.map((p,i)=>{let filled=i<round.built.length,multi=p==='x'||p==='qu';return multi?`<div class="double-box"><div class="box ${filled?'filled':''}">·</div><div class="box ${filled?'filled':''}">·</div>${filled?`<span class="bridge">${esc(C.soundFor(p).g)}</span>`:''}</div>`:`<div class="box ${filled?'filled':''}">${filled?esc(C.soundFor(p).g):'·'}</div>`;}).join('');if(w.parts.some(p=>p==='x'||p==='qu')&&!$('#two-sounds'))$('#boxes').insertAdjacentHTML('afterend','<p id="two-sounds" class="hint">Grown-up: x and qu each spell two sounds. One tile bridges two sound boxes.</p>');}
function highlightTile(){$('#tiles [data-correct=true]')?.classList.add('help');}
actions['word-model']=async()=>{let w=round.word,r=round;r.modelHeard=true;$('[data-act=word-model]')?.classList.add('chosen');if(w.parts.every(p=>A.has(p))){let completed=await A.sequence(w.parts,i=>{if(round===r&&screen===r.kind){let model=$('#model-word');if(model)model.innerHTML=w.parts.map((p,j)=>`<span style="background:${i===j?'#d6e5c6':'transparent'};padding:4px;border-radius:10px">${esc(C.soundFor(p).g)}</span>`).join('');}});if(completed&&round===r&&screen===r.kind)A.say(w.text);}else{say(`Listen with your grown-up. ${w.text}. Grown-up, say each pure sound, then slide them together. The whole word is ${w.text}.`);}};actions['word-we']=()=>{if(!round.modelHeard){say('First tap watch and listen. Then we will try it together.');return;}round.mode='guided';round.helped=true;round.modelled=false;drawWord();};actions['part']=el=>{let i=+el.dataset.index;round.heard.push(i);el.classList.add('heard');A.phoneme(round.word.parts[i]);if(new Set(round.heard).size===round.word.parts.length)$('[data-act=blend-arrow]').setAttribute('aria-disabled','false');};
function blendArrow(){if(round.blended)return;if(new Set(round.heard).size<round.word.parts.length){say('Tap each sound button first. Then we can slide them together.');return;}round.blended=true;A.say(round.word.text);let pool=round.pool.map(w=>w.text);if(pool.length<2){$('#picture-options').innerHTML=`<div class="choices">${btn('answer',round.word.pic,'picture',`data-value="${round.word.text}" data-correct="true"`)}${btn('answer','🌼','picture','data-value="shape" data-correct="false"')}</div>`;}else{$('#picture-options').innerHTML=choicesFor(round.word.text,pool,2,x=>C.wordFor(x).pic).replaceAll('class="letter"','class="picture"');}if(round.mode==='guided')$('[data-correct=true]')?.classList.add('help');}
actions['blend-arrow']=blendArrow;actions['whole-word']=()=>A.say(round.word.text);actions['tile']=el=>{if(round.done)return;let pos=round.built.length,w=round.word;if(el.dataset.value!==w.parts[pos]){wrong('word:'+w.text);highlightTile();return;}round.built.push(el.dataset.value);A.phoneme(el.dataset.value);drawTiles();if(round.built.length===w.parts.length){if(round.mode==='guided'){round.mode='independent';round.built=[];round.helped=false;shell(`<h2>Now, your turn.</h2>${speech()}<div class="picture center">${w.pic}</div>${btn('word-you','🧩 I can try','primary','style="width:100%"')}`,`We made ${w.text} together. Now you can build it yourself.`, 'build');}else{let first=!state.firstWord;state.firstWord=true;correct('word:'+w.text);if(first)$('#feedback').innerHTML+=btn('first-word','🙌 Show my grown-up!','gold');}}else if(round.mode==='guided')highlightTile();};actions['word-you']=()=>drawWord();actions['build-undo']=()=>{if(round.done)return;round.built.pop();drawTiles();};actions['build-help']=()=>{round.helped=true;highlightTile();say('We can do this together. Tap the glowing tile for the next sound.');};
function drawSentence(){let s=round.sentence;let words=C.tokenise(s.text);shell(`<div class="phase">Read to me · I do, we do, you do</div><h2>A little sentence.</h2>${dots()}${speech()}<div class="word-line">${words.map((w,i)=>btn('read-word',esc(w),'',`data-index="${i}"`)).join('')}</div><div class="row">${btn('read-model','🔊 I do')}${btn('read-check','🖼 Your turn','primary')}</div><div id="sentence-options"></div><p class="hint">Grown-up: model once, read it together, then listen to her try. Tapping words and pictures is practice, not proof of independent reading.</p>`,`Let us read together. You can tap each word to hear it. Grown-up, model the sentence, read it together, then let your reader try. Tap the picture button when you are ready.`, 'read');}
actions['read-word']=el=>{let i=+el.dataset.index;round.tappedWords.push(i);el.classList.add('chosen');A.say(C.tokenise(round.sentence.text)[i]);};actions['read-model']=()=>{round.helped=true;A.say(round.sentence.text);};actions['read-check']=()=>{if(new Set(round.tappedWords).size<C.tokenise(round.sentence.text).length){say('First tap each word and read it with your grown-up. Then we can find the picture.');return;}let arr=[{value:'yes',pic:round.sentence.pic},{value:'no',pic:round.sentence.other}].sort(()=>Math.random()-.5);$('#sentence-options').innerHTML=`<div class="choices">${arr.map(x=>btn('sentence-answer',x.pic,'picture',`data-value="${x.value}" data-correct="${x.value==='yes'}"`)).join('')}</div>`;say('Which picture matches our sentence?');};actions['sentence-answer']=el=>{if(round.done)return;if(el.dataset.value!=='yes'){wrong('sentence:'+round.sentence.text);return;}correct('sentence:'+round.sentence.text);};
const listening=[{type:'rhyme',prompt:'Which picture rhymes with cat? Cat, hat. They end the same way.',target:'hat',choices:['hat','dog'],pics:['👒','🐕'],model:true},{type:'rhyme',prompt:'Which picture rhymes with sun? Listen to sun, bun, cat.',target:'bun',choices:['bun','cat'],pics:['🥖','🐈']},{type:'first',prompt:'Listen to snake. Which picture starts with the same sound? Sun, dog.',target:'sun',choices:['sun','dog'],pics:['☀️','🐕']},{type:'first',prompt:'Listen to pig. Which picture starts with the same sound? Pan, cat.',target:'pan',choices:['pan','cat'],pics:['🍳','🐈']},{type:'clap',prompt:'Let us clap rabbit. Rab, bit. Two claps. Tap the hands with two claps.',target:'2',choices:['1','2'],pics:['👏','👏👏'],model:true},{type:'clap',prompt:'Clap dinosaur with your grown-up. Di, no, saur. Which picture shows three claps?',target:'3',choices:['2','3'],pics:['👏👏','👏👏👏']}];
function drawListening(){let l=listening[round.n%listening.length];round.listen=l;round.helped=!!l.model;shell(`<div class="phase">Listening picnic · ${l.type==='rhyme'?'Rhyme time':l.type==='first'?'First sounds':'Clap the beats'}</div><h2>Our ears are explorers.</h2>${dots()}${speech()}<div class="choices">${l.choices.map((x,i)=>`<div>${btn('listen-option',l.pics[i],'picture',`style="width:100%" data-value="${x}" data-correct="${x===l.target}" aria-label="Choose picture ${i+1}"`)}${l.type==='clap'?'':btn('listen-name','🔊','','style="width:100%;margin-top:10px" data-value="'+x+'" aria-label="Hear this picture name"')}</div>`).join('')}</div><p class="hint">Grown-up: say the picture names and clap together. These are listening words, not printed decoding words.</p>`,l.prompt,'listen');if(l.model)$('[data-correct=true]')?.classList.add('help');}
actions['listen-name']=el=>A.say(el.dataset.value);actions['listen-option']=el=>{if(round.done)return;if(el.dataset.value!==round.listen.target){wrong('listen:'+round.listen.type);return;}correct('listen:'+round.listen.type);};
function showHearts(){let h=D.hearts.find(h=>h.set<=state.stage&&!state.hearts.includes(h.text));if(!h){shell(`<h2>Our heart words.</h2>${speech()}<div class="grid">${state.hearts.map(h=>btn('heart-replay',`❤️<br>${esc(h)}`,'',`data-value="${esc(h)}"`)).join('')}</div>${btn('home','🌱 Back to our garden','primary')}`,'These are our heart words. Tap one to hear it again.','hearts');return;}round={kind:'heart',heart:h,phase:0,n:0,total:1,helped:true,built:[]};drawHeart();}
function drawHeart(){let h=round.heart;if(round.phase===0){shell(`<div class="phase">Heart words · hear it</div><h2>A little bit by heart.</h2>${speech()}<div class="word-line">${h.parts.map((p,i)=>`<div class="giant" style="font-size:74px">${esc(p)}${h.odd.includes(i)?'<div style="font-size:25px">❤️</div>':''}</div>`).join('')}</div><div class="picture center">${h.pic}</div>${btn('heart-hear','🔊 Listen together','pink','style="width:100%"')}${btn('heart-match','🤝 Match it','primary','style="width:100%;margin-top:14px"')}`,h.note+' Grown-up, point out what is familiar and the heart parts we remember.','hearts');}else if(round.phase===1){let pool=D.hearts.filter(x=>x.set<=state.stage).map(x=>x.text);shell(`<div class="phase">Heart words · match it</div><h2>Find our heart word.</h2>${speech()}<div class="giant center" style="font-size:74px">${esc(h.text)}</div>${choicesFor(h.text,pool,2,x=>esc(x),'heart-answer')}`,`Tap ${h.text}. Let us match it together.`, 'hearts');$('[data-correct=true]')?.classList.add('help');}else{shell(`<div class="phase">Heart words · make it</div><h2>Make our heart word.</h2>${speech()}<div class="word-line" style="font-size:40px">${esc(h.text)}</div><div class="boxes">${h.parts.map((p,i)=>`<div class="box ${i<round.built.length?'filled':''}">${i<round.built.length?esc(p):'❤️'}</div>`).join('')}</div><div class="tiles">${[...new Set(h.parts)].sort(()=>Math.random()-.5).map(p=>btn('heart-tile',esc(p),'',`data-value="${esc(p)}" data-correct="${p===h.parts[round.built.length]}"`)).join('')}</div>`,`Tap the pieces from left to right to make ${h.text}. We will remember its heart parts.`, 'hearts');}}
actions['heart-hear']=()=>{round.heard=true;A.say(round.heart.text);};actions['heart-match']=()=>{if(!round.heard){say('First tap the speaker to hear our heart word.');return;}round.phase=1;drawHeart();};actions['heart-answer']=el=>{if(el.dataset.value!==round.heart.text){wrong(null);return;}round.phase=2;drawHeart();};actions['heart-tile']=el=>{if(el.dataset.value!==round.heart.parts[round.built.length]){wrong(null);return;}round.built.push(el.dataset.value);if(round.built.length===round.heart.parts.length){if(!state.hearts.includes(round.heart.text))state.hearts.push(round.heart.text);C.record(state,'heart:'+round.heart.text,true,true);save();celebrate('A new heart word.',true);}else drawHeart();};actions['heart-replay']=el=>A.say(el.dataset.value);
function celebrate(title,canNext){let icon=['🌼','🦋','🌈','🍓','🐚','🍄','🌻','🍃'][state.stickers.length%8];state.stickers.push(icon);state.stars++;save();shell(`<div class="celebrate center"><div class="eyebrow">A little celebration</div><h1 style="margin-top:15px">${title}</h1><div style="font-size:90px;margin:18px">${icon}</div><p>A sticker for your book.</p>${btn('highfive','🖐','highfive','aria-label="High five your friend"')}<div>${mascot()}</div></div>${speech()}<div class="stack" style="margin-top:20px">${btn('home','🌱 Back to our garden','primary')}${canNext?'':btn('meet','🌼 Meet another friend','pink')}${btn('stickers','🌟 My sticker book')}${btn('end','🌙 A lovely place to stop')}</div>`,`You listened, tried and practised. Here is a sticker for your book. High five! We can stop here, or choose something gentle in the garden.`, 'celebrate');A.chime();if(!matchMedia('(prefers-reduced-motion: reduce)').matches){let c=$('.celebrate');for(let i=0;i<10;i++){let el=document.createElement('span');el.className='confetti';el.textContent=['✿','★','●'][i%3];el.style.setProperty('--x',(Math.random()*360-180)+'px');el.style.color=['#63915b','#cb885b','#a08db7'][i%3];c.append(el);setTimeout(()=>el.remove(),1800);}}checkProgress();}
function checkProgress(){let set=D.sets[state.stage];if(state.stage<7&&set.sounds.length&&set.sounds.every(id=>C.mastered(state,'sound:'+id))){state.stage++;save();}}
function stickers(){shell(`<div class="eyebrow">Little things to be proud of</div><h2 style="margin-top:12px">My sticker book.</h2>${speech()}<div class="sticker-grid">${state.stickers.length?state.stickers.map(s=>`<div class="sticker">${s}</div>`).join(''):Array.from({length:8},()=>'<div class="sticker" style="opacity:.4">✿</div>').join('')}</div><p class="hint">Stickers never disappear. There are no streaks, rare prizes, purchases or missed-day penalties.</p>${btn('home','🌱 Back to our garden','primary','style="width:100%"')}`,state.stickers.length?'These stickers remember our lovely practice. Tap the leaf to go back.':'This is your sticker book. A little sticker will grow here after a round. We do not have to hurry.','stickers');}
function library(){shell(`<div class="eyebrow">Cosy story nook</div><h2 style="margin-top:12px">Little books, just for us.</h2>${speech()}<p class="hint">In these books our mascot plays a bunny called Pat. We read only sounds and heart words we have met.</p><div class="stack">${D.books.map(b=>btn('book',`<span style="font-size:30px">${C.bookReady(b,state)?'📖':'🌱'}</span> ${esc(b.title)} ${state.books.includes(b.id)?'🌟':''}<span class="small" style="display:block">${C.bookReady(b,state)?'Ready to read together':'Growing: practise sounds across sessions'}</span>`,'',`data-index="${b.set}" aria-disabled="${!C.bookReady(b,state)}"`)).join('')}</div>`,'These little books grow as we learn. A book opens when its sound friends are secure across more than one session, and we have learned its heart words. Tap a book to see if it is ready.','library');}
function openBook(i){let b=D.books[i];if(!C.bookReady(b,state)){say('This book is still growing. Let us practise its sounds and heart words together. Your grown-up can see what is next behind the leaf.');return;}book=b;bookPage=0;drawBook();}
function drawBook(){let p=book.pages[bookPage];round={kind:'book',tappedWords:[]};shell(`<div class="phase">${esc(book.title)} · page ${bookPage+1} of ${book.pages.length}</div><div class="book-page"><div class="picture">${p.pic}</div><div class="word-line">${C.tokenise(p.text).map((w,i)=>btn('book-word',esc(w),'',`data-index="${i}"`)).join('')}</div></div>${speech()}<div class="row">${btn('book-together','🔊 Together')}${btn('book-next',bookPage===book.pages.length-1?'🌟 The end':'➜ Next page','primary')}</div><p class="hint">Grown-up: listen to her sound out the words, take turns, then talk about the picture. This book is practice, not a reading test.</p>`,bookPage===0?`In this book, our friend plays Pat. Read with your grown-up. Tap a word for help. When you have read the page together, tap the arrow.`:'Take your time. Read the words, and tell your grown-up what is happening.', 'book');}
actions['book-word']=el=>{let i=+el.dataset.index;round.tappedWords.push(i);el.classList.add('chosen');A.say(C.tokenise(book.pages[bookPage].text)[i]);};actions['book-together']=()=>{round.tappedWords=C.tokenise(book.pages[bookPage].text).map((_,i)=>i);A.say(book.pages[bookPage].text);};actions['book-next']=()=>{if(new Set(round.tappedWords).size<C.tokenise(book.pages[bookPage].text).length){say('Read the words together first. Tap the words, or tap the speaker to read with me.');return;}if(++bookPage<book.pages.length){drawBook();return;}if(!state.books.includes(book.id))state.books.push(book.id);let first=!state.firstBook;state.firstBook=true;save();celebrate(first?'Our very first book!':'Another story together.',true);$('#screen').insertAdjacentHTML('beforeend',btn('first-book','🙌 Show my grown-up!','gold','style="width:100%;margin-top:18px"'));};
function showProud(which){shell(`<div class="center celebrate"><div class="eyebrow">Come and see!</div><h1 style="margin-top:18px">${which==='word'?'I made my first word!':'We read a whole little book!'}</h1><div class="picture">🙌 📖 🌈</div>${mascot()}<p>We listened. We tried. We did it together.</p></div>${speech()}${btn('home','🌱 Back to our garden','primary','style="width:100%"')}`,`Come and see, grown-up! ${which==='word'?'I made my first word.':'We read a little book together.'} I listened to the sounds and kept trying.`, 'proud');}
let paint='#9a78bd',drawing=false;function room(){shell(`<div class="eyebrow">A little creative time</div><h2 style="margin-top:12px">${esc(state.mascot)}'s cosy studio.</h2>${speech()}<div class="center" id="room-mascot">${mascot()}</div><div class="row">${btn('animal','🐇','','data-value="bunny" aria-label="Bunny friend"')}${btn('animal','🦕','','data-value="dino" aria-label="Dinosaur friend"')}${btn('animal','🐱','','data-value="cat" aria-label="Cat friend"')}</div><p class="small center">${state.stars} creative stars · a new outfit costs one star, never real money</p><div class="row">${['🎀','👑','👒',''].map(x=>btn('outfit',x||'✨','',`data-value="${x}" aria-label="${x?'Choose outfit':'No hat'}"`)).join('')}</div><p class="small">Choose a coat colour, then colour our friend.</p><div class="row">${['#eee3ff','#f3c8c0','#cce4c2','#f4dd8e'].map(x=>btn('coat','',`colour ${state.colour===x?'selected':''}`,`style="background:${x}" data-value="${x}" aria-label="Choose coat colour"`)).join('')}</div><canvas id="drawing" class="canvas" width="600" height="420" aria-label="Drawing paper"></canvas><div class="row">${btn('stamp','🌼 Stamp a flower')}${btn('clear-draw','✨ Fresh paper')}</div><div class="panel"><h3>Give our friend a name.</h3><p class="small">Tap, listen, then keep a name you like.</p><div class="row">${['Pip','Bun','Dot'].map(x=>btn('mascot-name',esc(x),'',`data-value="${x}"`)).join('')}</div></div>`, 'Welcome to our cosy studio. Choose a friend or a coat colour. You can draw on the paper, or tap the flower to stamp. Outfits use one star from a round. There is never anything to buy.', 'room');wireCanvas();}
function wireCanvas(){let can=$('#drawing'),c=can.getContext('2d');c.lineWidth=8;c.lineCap='round';function redraw(){c.clearRect(0,0,600,420);for(let st of state.draw){c.strokeStyle=st.colour;c.fillStyle=st.colour;if(st.stamp){c.font='50px serif';c.fillText('🌼',st.x,st.y);continue;}c.beginPath();st.points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke();}}redraw();let current;const point=e=>{let r=can.getBoundingClientRect();return{x:(e.clientX-r.left)*600/r.width,y:(e.clientY-r.top)*420/r.height};};can.onpointerdown=e=>{drawing=true;can.setPointerCapture(e.pointerId);current={colour:paint,points:[point(e)]};state.draw.push(current);};can.onpointermove=e=>{if(!drawing)return;current.points.push(point(e));redraw();};can.onpointerup=can.onpointercancel=()=>{drawing=false;if(state.draw.length>100)state.draw=state.draw.slice(-100);save();};}
actions['animal']=el=>{state.animal=el.dataset.value;save();room();};actions['coat']=el=>{state.colour=el.dataset.value;paint=el.dataset.value;save();room();};actions['outfit']=el=>{let hat=el.dataset.value;if(hat&&state.outfit!==hat){if(state.stars<1){say('A creative star will grow after a practice round. You can still colour and draw now.');return;}state.stars--;}state.outfit=hat;save();room();};actions['mascot-name']=el=>{state.mascot=el.dataset.value;save();say(`My name is ${state.mascot}. I like playing with you.`);};actions['stamp']=()=>{state.draw.push({stamp:true,x:Math.random()*490+20,y:Math.random()*310+60,colour:paint});save();wireCanvas();};actions['clear-draw']=()=>{if(confirm('Use fresh paper? This clears this drawing only.')){state.draw=[];save();wireCanvas();}};
function endScreen(){ended=true;A.cancel();shell(`<div class="intro"><div class="eyebrow">A lovely place to stop</div><h1 style="margin-top:18px">Sleep tight,<br>${esc(state.mascot)}.</h1><div style="margin:30px auto">${mascot(true)}</div><h3>Little practice. Lovely effort.</h3><p>Now snuggle up with a real book.</p>${speech()}${btn('home','🌙 Tuck our friend in','pink','style="width:100%"')}<p class="small muted">Grown-up: put the device away and share a story, or play I-spy using sounds. A fresh session is available behind the leaf.</p></div>`,`Yawn. I am ready for a rest. You listened and tried today. Let us close the garden and read a real story with a grown-up. Night night.`, 'end');}
actions.start=start;actions.home=home;actions.repeat=()=>{let r=round,where=screen;A.say(lastPrompt).then(()=>{if(round===r&&screen===where&&r&&(r.kind==='hunt'||r.kind==='flash')){r.listened=true;A.phoneme(r.target);}});};actions.meet=()=>showMeet();for(let k of ['hunt','blend','build','listen','read','flash'])actions[k]=()=>begin(k);actions.hearts=showHearts;actions.library=library;actions.book=el=>openBook(+el.dataset.index);actions.stickers=stickers;actions.room=room;actions.end=endScreen;actions.highfive=()=>{say('High five! You kept trying and listening.');A.chime();};actions['first-word']=()=>showProud('word');actions['first-book']=()=>showProud('book');actions.stone=el=>{let i=+el.dataset.index;say(i===state.stage?'This is where we are growing now. Choose a game below.':'Our garden grows step by step. A grown-up can match the starting set to school behind the leaf.');};actions.gate=()=>{};
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el)return;let fn=actions[el.dataset.act];if(fn){try{let p=fn(el);if(p?.catch)p.catch(e=>say('Please ask a grown-up for help. '+e.message));}catch(e){say('Please ask a grown-up for help. '+e.message);}}});
setInterval(()=>{let now=Date.now(),delta=Math.min(now-lastTick,15000);lastTick=now;if(started&&!ended&&!document.hidden&&screen!=='adult'){activeMs+=delta;if(activeMs>=state.settings.minutes*60000)endScreen();}},5000);
window.addEventListener('pagehide',()=>{A.cancel();A.stopRecording();save();});document.addEventListener('visibilitychange',()=>{lastTick=Date.now();if(document.hidden){A.cancel();A.stopRecording();}});
const iconSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#f6e9ce"/><text x="18" y="146" font-size="135">🐇</text></svg>`;
$('#touch-icon')?.setAttribute('href','data:image/svg+xml,'+encodeURIComponent(iconSvg));const hosted=/^https?:$/.test(location.protocol);let manifest={name:"Bunny's Reading Garden",short_name:'Reading Garden',display:'standalone',start_url:'./',theme_color:'#397e69',background_color:'#fff9ee'};$('#manifest')?.setAttribute('href',hosted?'manifest.webmanifest':'data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest)));if(hosted){$('#touch-icon').href='icons/apple-touch-icon.png';if('serviceWorker'in navigator&&isSecureContext)navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{offline=true;}).catch(()=>{offline=false;});}
function showAdult(){if(G.adult)G.adult();}
launch();
return {setLeaveAdult:fn=>onLeaveAdult=fn,actions,esc,btn,shell,speech,say,save,mascot,home,start,showMeet,showHearts,library,room,C,A,D,get state(){return state;},get round(){return round;},get screen(){return screen;},get saveError(){return saveError;},get offline(){return offline;},replaceState:s=>{state=s;save();},newSession:()=>{ended=false;started=true;activeMs=0;lastTick=Date.now();state.session++;save();home();},stop:()=>{ended=true;endScreen();}};
})();
window.ReadingGarden=G;
</script><script>/* Grown-up controls: every entry uses the hold gate. No remote services. */
(()=>{const {C,A,D,esc,btn}=G;let recordingId='',recordingBusy=false,message='';
function skill(key,label){let stats=G.state.stats[key],status=C.status(G.state,key);return `<div class="skill ${stats?status:''}">${esc(label)}<span class="small">${stats?status:'not checked'}${stats?` · ${stats.right}/${stats.attempts} independent`:''}</span></div>`;}
function adult(){A.cancel();const s=G.state;let practice=D.sounds.filter(x=>s.taught.includes(x.id)&&!C.mastered(s,'sound:'+x.id)).sort((a,b)=>C.reviewWeight(s,'sound:'+b.id)-C.reviewWeight(s,'sound:'+a.id)).slice(0,4);let next=C.nextSound(s);let suggestions=practice.length?practice.map(x=>`<li>Listen for the ${x.where==='end'?'last':'first'} sound in <strong>${esc(x.hook)}</strong>. Match ${esc(x.g)} and use the recorded pure sound.</li>`).join(''):'<li>Keep it playful. Meet one new sound, then revisit a familiar one.</li>';
G.shell(`<div class="adult"><div class="eyebrow">For our reading partner</div><h2 style="margin-top:12px">A little guidance.</h2>${G.speech()}${message?`<div class="warning" id="adult-message">${esc(message)}</div>`:''}<div class="panel"><h3>What to practise together</h3><ul class="small">${suggestions}${next?`<li>Next new sound: ${esc(next.g)} — ${esc(next.hook)}. Introduce it in Meet a Sound, not a test.</li>`:''}</ul><p class="small">Point to the letters, blend left to right, and ask “What sounds can you hear?” Play I-spy with sounds. Read a rich story aloud every day, even when it is not decodable. Talk about the story and let her choose books.</p><p class="small">Aim for comfortable success. If it gets hard, model, guide, then try again. Stop sooner when she is tired. No need to finish a round.</p></div><div class="panel"><h3>Sound garden</h3><p class="small">Green: secure practice · peach: needs support · cream: learning/not checked. “Mastered” here means ≥6 independent correct, ≥85% in the latest 12 attempts, across ≥2 sessions. These are app heuristics, not a clinical or school assessment. Tapping is not evidence of oral decoding.</p>${D.sets.map((set,i)=>`<p class="small"><strong>${i+1}. ${esc(set.title)}</strong>${i===s.stage?' · current':''}</p><div class="grid">${set.sounds.map(id=>skill('sound:'+id,C.soundFor(id).g+(id==='thv'?' (voice on)':''))).join('')}</div>${i===7?'<p class="small">CCVC/CVCC: practise every sound in frog, jump and other final-set words. No single-letter shortcuts.</p>':''}`).join('')}<p class="small">School-taught earlier sounds: ${s.school?`sets before ${s.school+1} are available for practice, not automatically marked mastered.`:'none assumed.'}</p></div><div class="panel"><h3>Words & heart words</h3><p class="small">Only first-try independent responses count; modelled or corrected responses are logged as helped.</p><div class="grid">${D.words.filter(w=>C.availableWords(s).includes(w)).map(w=>skill('word:'+w.text,w.text)).join('')}</div><h3 style="margin-top:18px">Heart words</h3><div class="grid">${D.hearts.map(h=>`<div class="skill ${s.hearts.includes(h.text)?'mastered':''}" style="font-size:22px">${esc(h.text)}<span class="small">${s.hearts.includes(h.text)?'explicitly introduced':'not introduced'}</span></div>`).join('')}</div><p class="small">Heart words are explicitly taught as regular/remembered parts, then matched and built. Green here means introduced, not independently mastered.</p><h3>Books read together</h3><ul class="small">${D.books.map(b=>`<li>${esc(b.title)} — ${s.books.includes(b.id)?'read together':C.bookReady(b,s)?'unlocked':'still growing'}</li>`).join('')}</ul></div><div class="panel"><h3>Make it hers</h3><label for="child-name">Child's display name (device only)</label><input id="child-name" maxlength="32" value="${esc(s.child)}" autocomplete="off"><label for="mascot-name">Mascot's name</label><input id="mascot-name" maxlength="24" value="${esc(s.mascot)}" autocomplete="off"><p class="small">Bunny, dinosaur and cat choices are in the studio. In all decodable books the mascot plays “Pat”, so a chosen name cannot introduce untaught spelling.</p><label for="start-set">Starting phonics set — match her school</label><select id="start-set">${D.sets.map((x,i)=>`<option value="${i}" ${s.stage===i?'selected':''}>${i+1}. ${esc(x.sounds.map(id=>C.soundFor(id).g).join(' '))||'CCVC / CVCC words'}</option>`).join('')}</select><p class="small">Choosing a later set makes earlier sounds available as school-taught; it never invents mastery or unlocks books. Heart words still need their explicit lessons.</p><label for="sound-setting">Sound</label><select id="sound-setting"><option value="on" ${s.settings.sound?'selected':''}>On — spoken play</option><option value="off" ${!s.settings.sound?'selected':''}>Off — grown-up co-play only</option></select><label for="session-minutes">Gentle session end</label><select id="session-minutes">${[5,7,10].map(n=>`<option value="${n}" ${s.settings.minutes===n?'selected':''}>${n} minutes</option>`).join('')}</select>${btn('save-settings','🌱 Save settings','primary','style="width:100%;margin-top:20px"')}</div><div class="panel"><h3>Record the pure sounds</h3><p class="small">Use a quiet room. Say only the sound, not the letter name; avoid adding “uh”. Stretch continuants such as /s/ and /m/. Keep stop sounds such as /t/ short. Record the short vowels shown by the hooks. You are responsible for checking purity and pronunciation.</p><p class="small">For <strong>ck</strong>, the final sound of duck; <strong>ss/ff/ll</strong>, one sound, not two. <strong>x</strong> is /ks/ at the end of box; <strong>qu</strong> is /kw/ at the start of queen. <strong>ng</strong> is one sound at the end of ring (no extra g). Record both th sounds separately: thumb (voice off), this (voice on). A whole-word clue is not a pure-sound recording.</p><div class="warning">${A.error()?esc(A.error()):'Microphone access is requested only when you tap Record. Saved sounds are stored in this browser/device and are not uploaded by the app.'}</div><label for="record-sound">Choose a sound</label><select id="record-sound">${D.sounds.map(x=>`<option value="${x.id}">${esc(x.g)}${x.id==='thv'?' (voice on)':''} — ${esc(x.where)} of ${esc(x.hook)} ${A.has(x.id)?'✓ saved':''}</option>`).join('')}</select><div class="center picture" id="record-hook">${D.sounds[0].pic}</div><div class="stack">${btn('record-start','🎙 Record','pink','id="record-start"')}${btn('record-stop','⏹ Stop & save','','id="record-stop" aria-disabled="true"')}${btn('record-play','▶ Play saved sound')}${btn('record-delete','Remove this recording')}</div><p id="record-status" class="small" aria-live="polite">${recordingBusy?'Recording… tap Stop & save.':'Record once, stop, then play it back and check.'}</p><p class="small">Recording stops after 10 seconds as a safety limit. Safari may need HTTPS and microphone permission. If it fails, keep co-playing with a grown-up and use the example-word clues.</p></div><div class="panel"><h3>On this device</h3><p class="small">Voice: ${esc(A.voice()||'No downloaded English voice detected. Add one in device accessibility/spoken-content voice settings, then reopen.')}<br>Offline shell: ${G.offline?'ready in this browser':'not yet confirmed; load the hosted version online first.'}<br>Progress: ${esc(G.saveError||'saved locally; not synced between devices')}</p><p class="small">For iPhone/iPad: open the hosted address in Safari, Share → Add to Home Screen. Reopen once online; then test Airplane Mode. Downloaded system voices are needed for offline instructions. Browser data can be cleared or evicted; recordings and progress are not permanent backups.</p></div><div class="panel"><h3>Why this design?</h3><p class="small">Systematic, explicit phonics connects speech sounds to print. Children hear, match, blend and segment, then read cumulative text. We model, guide, and offer independent practice. Weak or overdue items return more often. Pictures provide meaning after sounding out, not a strategy for guessing words. Vocabulary, conversation and shared reading matter too.</p><p class="small">Research supports these teaching principles, not the effectiveness of this untested app. The success target, mastery thresholds, stickers and session lengths are design heuristics. Small predictable celebrations acknowledge effort; there are no lives, streaks, countdowns, purchases or random prize odds. Surprise stickers follow a simple repeating pattern, never a rarity ladder. Familiar-friends rounds have no speed score or time pressure.</p><details><summary style="padding:20px 0;cursor:pointer">Research sources (grown-ups only)</summary><ul class="small"><li><a href="https://www.edresearch.edu.au/summaries-explainers/explainers/introduction-science-reading" target="_blank" rel="noopener noreferrer">AERO: science of reading</a></li><li><a href="https://ies.ed.gov/ncee/wwc/practiceguide/21" target="_blank" rel="noopener noreferrer">WWC: foundational reading skills</a></li><li><a href="https://www.edresearch.edu.au/guides-resources/practice-guides/spacing-and-retrieval-practice-guide-full-publication" target="_blank" rel="noopener noreferrer">AERO: spacing and retrieval</a></li><li><a href="https://developingchild.harvard.edu/resources/briefs/how-to-motivate-children-science-based-approaches-for-parents-caregivers-and-teachers/" target="_blank" rel="noopener noreferrer">Harvard: motivation, agency and process praise</a></li></ul></details></div><div class="panel stack">${btn('new-session','🌤 Begin a fresh session','primary')}${btn('reset','Reset game progress — confirm first')}${btn('home','🌱 Back to the garden')}</div></div>`, 'Hello, grown-up. Here are our learning notes, settings and sound recordings. A little practice together is enough.','adult');const select=document.querySelector('#record-sound');select.value=recordingId||'s';document.querySelector('#record-hook').textContent=C.soundFor(select.value).pic;select.onchange=()=>{recordingId=select.value;document.querySelector('#record-hook').textContent=C.soundFor(select.value).pic;};if(recordingBusy){select.disabled=true;document.querySelector('#record-start').setAttribute('aria-disabled','true');document.querySelector('#record-stop').setAttribute('aria-disabled','false');}}
G.adult=adult;G.setLeaveAdult(()=>{recordingBusy=false;A.stopRecording();});
G.actions['save-settings']=()=>{let s=G.state;s.child=document.querySelector('#child-name').value.trim().slice(0,32)||'little reader';s.mascot=document.querySelector('#mascot-name').value.trim().slice(0,24)||'Pip';C.startAt(s,+document.querySelector('#start-set').value);s.settings.sound=document.querySelector('#sound-setting').value==='on';s.settings.minutes=+document.querySelector('#session-minutes').value;A.setEnabled(s.settings.sound);G.save();message='Settings saved on this device.';adult();};
G.actions['record-start']=async()=>{if(recordingBusy)return;recordingBusy=true;recordingId=document.querySelector('#record-sound').value;const status=document.querySelector('#record-status');status.textContent='Opening microphone…';try{let began=await A.startRecording(recordingId,(id,bytes)=>{recordingBusy=false;message=`Saved ${C.soundFor(id).g}: ${bytes} bytes on this device. Play it back to check the sound.`;if(G.screen==='adult')adult();},msg=>{recordingBusy=false;message=msg;if(G.screen==='adult')adult();});if(began===false){recordingBusy=false;return;}if(G.screen==='adult'){status.textContent='Recording… say only the pure sound, then tap Stop & save.';document.querySelector('#record-start').classList.add('recording');document.querySelector('#record-start').setAttribute('aria-disabled','true');document.querySelector('#record-stop').setAttribute('aria-disabled','false');document.querySelector('#record-sound').disabled=true;}}catch(e){recordingBusy=false;message='Could not record: '+(e.name==='NotAllowedError'?'allow microphone access in Safari settings, then try again.':e.message);adult();}};
G.actions['record-stop']=()=>{if(recordingBusy)A.stopRecording();};G.actions['record-play']=()=>{let id=document.querySelector('#record-sound').value;if(!A.has(id)){G.say('There is no recording for this sound yet. Tap record to add one.');return;}A.phoneme(id);};G.actions['record-delete']=async()=>{let id=document.querySelector('#record-sound').value;if(A.has(id)&&confirm('Remove only this saved sound? It can be recorded again.')){await A.remove(id);message='This sound recording was removed.';adult();}};
G.actions['new-session']=()=>{if(recordingBusy){message='Stop the current recording first.';adult();return;}G.newSession();};G.actions.reset=()=>{if(recordingBusy)return;if(confirm('Reset all reading-game progress, drawings, stickers and names on this device? Pure-sound recordings will be kept.')){G.replaceState(C.fresh());message='Game progress reset. Saved pure-sound recordings were kept.';adult();}};
})();
</script></body></html>
